<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Angel</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --text-dark: #4a4a4a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Background photo with a dark overlay for readability */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('us.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .polaroid-card {
            background: white;
            padding: 20px 20px 50px 20px;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            width: 85%;
            max-width: 340px;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary-pink);
            font-size: 2.2rem;
            margin: 10px 0;
        }

        p {
            color: var(--text-dark);
            line-height: 1.6;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        /* Buttons Styling */
        .btn-action {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            pointer-events: auto; /* Ensures it is clickable */
        }

        .btn-action:active { transform: scale(0.95); }

        /* The Question Buttons Layout */
        .ask-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        #noBtn {
            background: #f0f0f0;
            color: #888;
            border: 1px solid #ddd;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
        }

        /* Typewriter Animation for the Name */
        .typewriter-text {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid var(--primary-pink);
            width: 0;
        }

        .animate-typewriter {
            animation: typing 2.5s steps(20, end) forwards, blink 0.7s infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--primary-pink) } }

        /* Hide sections initially */
        #name-section, #final-question, #success-message {
            display: none;
        }
    </style>
</head>
<body>

    <div class="polaroid-card">
        
        <div id="reason-section">
            <p id="current-reason">"5 years as best friends, and every moment has been a gift."</p>
            <button class="btn-action" onclick="handleNext()">Keep reading...</button>
        </div>

        <div id="name-section">
            <h1 id="name-text" class="typewriter-text">So... Angelina Teh Hui Szen</h1>
        </div>

        <div id="final-question">
            <h1>Will you be my Valentine?</h1>
            <p>From being best friends for 5 years, lets make this year special, with each other.</p>
            <div class="ask-container">
                <button class="btn-action" onclick="celebrate()">YES! ❤️</button>
                <button id="noBtn" onmouseover="evadeNo()" onclick="evadeNo()">No</button>
            </div>
        </div>

        <div id="success-message">
            <h1>Congratulations, it's a Date! 🎉</h1>
            <p>I am very excited . See you on the 14th!</p>
        </div>

    </div>

    <script>
        const reasonsList = [
            "I admire your boldness, your drive, your passion, your love, your empathy, your care, your charm.",
            "We bond so well that you understand me in and out.",
            "I can be myself when I'm with you, without the fear of being judged.",
            "You're the person I want to share every win and every meal with."
            "I've realised that my favourite place to be is wherever you are."
        ];

        let index = 0;

        function handleNext() {
            if (index < reasonsList.length) {
                document.getElementById('current-reason').innerText = `"${reasonsList[index]}"`;
                index++;
            } else {
                startNameAnimation();
            }
        }

        function startNameAnimation() {
            document.getElementById('reason-section').style.display = 'none';
            const nameSec = document.getElementById('name-section');
            nameSec.style.display = 'block';
            
            // Trigger the typing CSS
            document.getElementById('name-text').classList.add('animate-typewriter');

            // Wait 3.5 seconds then show the final question
            setTimeout(() => {
                nameSec.style.display = 'none';
                document.getElementById('final-question').style.display = 'block';
            }, 3500);
        }

        function evadeNo() {
            const btn = document.getElementById('noBtn');
            // Move the button to a random spot on the screen
            const newX = Math.random() * (window.innerWidth - btn.offsetWidth);
            const newY = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.position = 'fixed';
            btn.style.left = newX + 'px';
            btn.style.top = newY + 'px';
            btn.style.zIndex = '999';
        }

        function celebrate() {
            document.getElementById('final-question').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
            
            // Confetti Cannon
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4d6d', '#ffffff']
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4d6d', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
