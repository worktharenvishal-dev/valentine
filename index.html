<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Angeline Teh</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --primary-pink: #ff4d6d; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Quicksand', sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: #222; /* Fallback */
            overflow: hidden;
        }

        /* The Background Photo */
        .bg-photo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('us.jpg');
            background-size: cover; background-position: center;
            z-index: 1;
        }

        .polaroid-card {
            position: relative;
            z-index: 100; /* High z-index to stay above background */
            background: white;
            padding: 25px 25px 50px 25px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 85%; max-width: 320px;
            text-align: center;
            pointer-events: auto; /* Force clickability */
        }

        .btn-action {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 35px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            display: block;
            margin-top: 20px;
            position: relative;
            z-index: 101; /* Higher than card */
            touch-action: manipulation; /* Optimizes for mobile taps */
        }

        /* Typewriter Animation */
        .typewriter-text {
            display: inline-block; overflow: hidden; white-space: nowrap;
            border-right: 3px solid var(--primary-pink); width: 0;
            font-family: 'Dancing Script', cursive; color: var(--primary-pink); font-size: 2.2rem;
        }
        .animate-typewriter { animation: typing 2.5s steps(20, end) forwards, blink 0.7s infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--primary-pink) } }

        .ask-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 20px; }
        #noBtn { background: #eee; color: #888; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; }
        #name-section, #final-question, #success-message { display: none; }
    </style>
</head>
<body>

    <div class="bg-photo"></div>

    <div class="polaroid-card">
        
        <div id="reason-section">
            <p id="current-reason" style="font-size: 1.1rem; color: #444; line-height: 1.6;">
                "5 years of being best friends has led us here..."
            </p>
            <button class="btn-action" id="next-button" onclick="handleNext()">Keep reading...</button>
        </div>

        <div id="name-section">
            <h1 id="name-text" class="typewriter-text">So... Angeline Teh</h1>
        </div>

</body>
</html>
