<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Angeline Teh</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #ff4d6d; --secondary: #ff758f; }

        body { 
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; background: #000;
        }
        
        #bg-container { position: fixed; top:0; left:0; width:100%; height:100%; z-index: -1; overflow: hidden; }
        #bg-image { 
            width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('us.jpg') center/cover;
            animation: kenburns 20s infinite alternate;
        }
        @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.1); } }

        #hearts-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .heart { position: absolute; color: rgba(255, 77, 109, 0.4); animation: floatUp 6s linear infinite; }
        @keyframes floatUp { from { transform: translateY(100vh); opacity: 1; } to { transform: translateY(-10vh); opacity: 0; } }

        .card { 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            padding: 40px 30px; border-radius: 30px; text-align: center; 
            width: 85%; max-width: 350px; position: relative; z-index: 10;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.4);
            min-height: 300px; display: flex; flex-direction: column; justify-content: center;
        }

        .typewriter { 
            font-family: 'Dancing Script', cursive; color: var(--primary); 
            font-size: 1.6rem; line-height: 1.4; margin: 0 auto;
        }

        .btn-container { margin-top: 25px; transition: opacity 0.5s ease; }
        #nextBtn, #yesBtn { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; border: none; padding: 15px; border-radius: 50px; font-weight: 600; width: 100%; cursor: pointer; transition: 0.3s; }
        .no-btn { background: #eee; color: #888; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; margin-top: 15px; }

        #name-screen, #ask-screen, #success-screen, #flower-container { display: none; }

        /* Glowing Flower Styling */
        #flower-container { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); z-index: 5; }
        .flower { position: relative; width: 40px; height: 100px; background: #2d5a27; border-radius: 10px; animation: grow 2s ease-out forwards; }
        .petal { position: absolute; top: -15px; left: 50%; width: 30px; height: 30px; background: #ff4d6d; border-radius: 50% 50% 0 50%; transform-origin: bottom center; filter: drop-shadow(0 0 8px #ff4d6d); }
        .petal:nth-child(2) { transform: rotate(72deg); }
        .petal:nth-child(3) { transform: rotate(144deg); }
        .petal:nth-child(4) { transform: rotate(216deg); }
        .petal:nth-child(5) { transform: rotate(288deg); }
        @keyframes grow { from { height: 0; } to { height: 100px; } }
    </style>
</head>
<body>

    <div id="bg-container"><div id="bg-image"></div></div>
    <div id="hearts-container"></div>

    <div class="card">
        <div id="reason-screen">
            <div id="reason-text" class="typewriter"></div>
            <div id="next-btn-container" class="btn-container" style="opacity: 0;">
                <button id="nextBtn" onclick="handleNext()">Keep reading...</button>
            </div>
        </div>

        <div id="name-screen">
            <div id="name-text" class="typewriter"></div>
        </div>

        <div id="ask-screen">
            <div id="ask-text" class="typewriter"></div>
            <div id="ask-btn-container" class="btn-container" style="opacity: 0;">
                <button id="yesBtn" onclick="celebrate()">YES! ❤️</button>
                <button id="noBtn" class="no-btn" onclick="handleNo()">No</button>
            </div>
        </div>

        <div id="success-screen">
            <h1 style="font-family: 'Dancing Script', cursive; color: var(--primary);">It's a Date! ❤️</h1>
            <p>I'll see you on the 14th.</p>
        </div>
    </div>

    <div id="flower-container">
        <div class="flower">
            <div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        </div>
    </div>

    <script>
        // BACKGROUND HEARTS
        function createHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.innerHTML = '❤️'; heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 500);

        // TYPEWRITER ENGINE
        function typeWriter(text, elementId, callback) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            const speed = 50; 

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        const reasons = [
            "5 years of being best friends has led us here...",
            "I admire your boldness, your passion, and your empathy.",
            "You understand me in and out.",
            "I can truly be myself when I'm with you.",
            "I've realized my favorite place to be is wherever you are."
        ];
        let currentIdx = 0;

        // INITIAL LOAD
        window.onload = () => {
            typeWriter(reasons[currentIdx], 'reason-text', showNextButton);
        };

        function showNextButton() {
            document.getElementById('next-btn-container').style.opacity = "1";
        }

        function handleNext() {
            document.getElementById('next-btn-container').style.opacity = "0";
            currentIdx++;
            if (currentIdx < reasons.length) {
                typeWriter(reasons[currentIdx], 'reason-text', showNextButton);
            } else {
                startNameReveal();
            }
        }

        function startNameReveal() {
            document.getElementById('reason-screen').style.display = 'none';
            document.getElementById('name-screen').style.display = 'block';
            typeWriter("So... Angelina Teh Hui Szen", "name-text", () => {
                setTimeout(startAskReveal, 1500);
            });
        }

        function startAskReveal() {
            document.getElementById('name-screen').style.display = 'none';
            document.getElementById('ask-screen').style.display = 'block';
            typeWriter("Will you be my Valentine?", "ask-text", () => {
                document.getElementById('ask-btn-container').style.opacity = "1";
            });
        }

        let noCount = 0;
        const noTexts = ["Are you sure?", "Think again!", "Please?", "Last chance!", "Wait, no!"];
        function handleNo() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            noBtn.innerText = noTexts[Math.min(noCount++, noTexts.length - 1)];
            const scale = 1 + (noCount * 0.4);
            yesBtn.style.transform = `scale(${scale})`;
            if(noCount > 5) { noBtn.style.display = "none"; }
        }

        function celebrate() {
            document.getElementById('ask-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
            document.getElementById('flower-container').style.display = 'block';
            const end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d', '#ffffff'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4d6d', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
