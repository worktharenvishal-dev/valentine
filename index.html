<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Angel</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* Direct Background Fix */
        #bg { position: fixed; top:0; left:0; width:100%; height:100%; background: url('us.jpg') center/cover; opacity: 0.5; z-index: -1; }

        .card { 
            background: white; padding: 30px; border-radius: 15px; text-align: center; 
            width: 80%; max-width: 300px; position: relative; z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        button { 
            background: #ff4d6d; color: white; border: none; padding: 15px 20px; 
            border-radius: 10px; font-weight: bold; width: 100%; font-size: 1.1rem;
            cursor: pointer; display: block; margin-top: 20px;
            -webkit-appearance: none; /* Fix for Safari */
        }

        #name-screen, #ask-screen, #success { display: none; }
        h1 { color: #ff4d6d; font-family: serif; }
        .no-btn { background: #eee; color: #888; margin-top: 10px; width: auto; display: inline-block; padding: 10px 20px; }
    </style>
</head>
<body>

    <div id="bg"></div>

    <div class="card">
        <div id="start-screen">
            <p id="msg">5 years of being best friends has led us here...</p>
            <button type="button" onclick="handleNext()">Keep reading...</button>
        </div>

        <div id="name-screen">
            <h1 style="border-right: 2px solid #ff4d6d; overflow: hidden; white-space: nowrap; width: 0; animation: type 2s steps(20) forwards;">So... Angelina Teh Hui Szen</h1>
        </div>

        <div id="ask-screen">
            <h1>Will you be my Valentine?</h1>
            <p>After 5 years of being best friends, why not we make this year special? With each other?</p>
            <button onclick="celebrate()">YES! ❤️</button>
            <button id="no" class="no-btn" onmouseover="run()">No</button>
        </div>

        <div id="success">
            <h1>It's a Date!</h1>
            <p>See you on the 14th! ❤️</p>
        </div>
    </div>

    <script>
        // Debugging line: This will pop up the SECOND the page loads
        console.log("Script Loaded Successfully");

        const items = [
            "I admire your boldness, your drive, your passion, your love, your empathy, your care, your charm.",
            "We bond so well that you understand me in and out.",
            "I can be myself when I'm with you, without the fear of being judged.",
            "You're the person I want to share every win and every meal with."
            "I've realised that my favourite place to be is wherever you are."
        ];
        let i = 0;

        function handleNext() {
            if (i < items.length) {
                document.getElementById('msg').innerText = items[i];
                i++;
            } else {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('name-screen').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('name-screen').style.display = 'none';
                    document.getElementById('ask-screen').style.display = 'block';
                }, 3000);
            }
        }

        function run() {
            const b = document.getElementById('no');
            b.style.position = 'fixed';
            b.style.left = Math.random() * 80 + '%';
            b.style.top = Math.random() * 80 + '%';
        }

        function celebrate() {
            document.getElementById('ask-screen').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            confetti();
        }
    </script>
    <style>@keyframes type { from { width: 0; } to { width: 100%; } }</style>
</body>
</html>
