<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>my angel</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #ff4d6d; --secondary: #ff758f; }

        body { 
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; background: #000;
        }
        
        #bg-container { position: fixed; top:0; left:0; width:100%; height:100%; z-index: -1; overflow: hidden; }
        #bg-image { 
            width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('us.jpg') center/cover;
            animation: kenburns 20s infinite alternate;
        }
        @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.1); } }

        #hearts-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .heart { position: absolute; color: rgba(255, 77, 109, 0.4); animation: floatUp 6s linear infinite; }
        @keyframes floatUp { from { transform: translateY(100vh); opacity: 1; } to { transform: translateY(-10vh); opacity: 0; } }

        .card { 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            padding: 40px 30px; border-radius: 30px; text-align: center; 
            width: 85%; max-width: 350px; position: relative; z-index: 10;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.4);
            min-height: 350px; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .stage-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .typewriter { 
            font-family: 'Dancing Script', cursive; color: var(--primary); 
            font-size: 1.7rem; line-height: 1.4; margin-bottom: 20px;
            width: 100%;
        }

        .big-question { font-size: 2.5rem !important; font-weight: 700; margin-bottom: 30px; }

        .btn-container { 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; 
            transition: opacity 0.4s ease; 
            visibility: hidden; 
        }
        .btn-container.show { opacity: 1; visibility: visible; }
        
        button.main { 
            background: linear-gradient(45deg, var(--primary), var(--secondary)); 
            color: white; border: none; padding: 16px; border-radius: 50px; 
            font-weight: 600; width: 100%; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.2);
        }
        .no-btn { background: #eee; color: #888; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; margin-top: 15px; font-size: 0.9rem; }

        #music-control {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            background: rgba(255,255,255,0.8); border-radius: 50%; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; border: none;
        }

        /* Success Animation */
        #success-screen h1 { 
            font-family: 'Dancing Script', cursive; color: var(--primary); font-size: 4.5rem;
            margin: 0;
            animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { 0% { transform: scale(0) rotate(-10deg); } 100% { transform: scale(1) rotate(0); } }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="blessed.mp3" type="audio/mpeg"></audio>
    <button id="music-control" onclick="toggleMusic()">🎵</button>
    <div id="bg-container"><div id="bg-image"></div></div>
    <div id="hearts-container"></div>

    <div class="card">
        <div id="start-screen" class="stage-container" style="display: flex;">
            <p style="font-weight: 600; font-size: 1.1rem; margin-bottom: 10px;">5 years of memories have led to this moment...</p>
            <p style="font-weight: 600; font-size: 1.1rem; margin-bottom: 30px;">Why not we make this year special? with the both of us?</p>
            <button class="main" onclick="startExperience()">Start ❤️</button>
        </div>

        <div id="reason-screen" class="stage-container">
            <div id="reason-text" class="typewriter"></div>
            <div id="reason-btn-container" class="btn-container">
                <button class="main" onclick="handleNext()">Keep reading...</button>
            </div>
        </div>

        <div id="name-screen" class="stage-container">
            <div id="name-text" class="typewriter"></div>
        </div>

        <div id="ask-screen" class="stage-container">
            <div id="ask-text" class="typewriter big-question"></div>
            <div id="ask-btn-container" class="btn-container">
                <button class="main" id="yesBtn" onclick="celebrate()">YES! ❤️</button>
                <button id="noBtn" class="no-btn" onclick="handleNo()">No</button>
            </div>
        </div>

        <div id="success-screen" class="stage-container">
            <h1>It's a Date! ❤️</h1>
            <p style="font-weight: 600; color: #444; font-size: 1.2rem; margin-top: 10px;">See you on the 14th my beautiful princess</p>
            <p style="color: #444; margin: 5px 0;">I'm glad you didn't say no to me x</p>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const reasons = [
            "I admire your boldness, your passion, and your empathy.",
            "You understand me better than anyone else.",
            "I can truly be myself when I'm with you.",
            "I want to share every win and every meal with you.",
            "I've realized my favorite place to be is wherever you are."
        ];
        let currentIdx = 0;

        function toggleMusic() { audio.paused ? audio.play() : audio.pause(); }

        function startExperience() {
            audio.play().catch(() => {});
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('reason-screen').style.display = 'flex';
            runTypewriter(reasons[currentIdx], 'reason-text', 'reason-btn-container');
        }

        function runTypewriter(text, elementId, btnId) {
            const el = document.getElementById(elementId);
            const btn = btnId ? document.getElementById(btnId) : null;
            if (btn) btn.classList.remove('show');
            el.innerHTML = "";
            let i = 0;
            (function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i++);
                    setTimeout(type, 50);
                } else { if (btn) btn.classList.add('show'); }
            })();
        }

        function handleNext() {
            currentIdx++;
            if (currentIdx < reasons.length) {
                runTypewriter(reasons[currentIdx], 'reason-text', 'reason-btn-container');
            } else {
                document.getElementById('reason-screen').style.display = 'none';
                document.getElementById('name-screen').style.display = 'flex';
                runTypewriter("So... My Beautiful Angelina Teh Hui Szen", 'name-text', null);
                
                // Fixed transition to ensure Name screen disappears before Ask screen
                setTimeout(() => {
                    document.getElementById('name-screen').style.display = 'none';
                    document.getElementById('ask-screen').style.display = 'flex';
                    runTypewriter("Will you be my Valentine?", 'ask-text', 'ask-btn-container');
                }, 4000); // Slightly longer to finish the long name
            }
        }

        let noCount = 0;
        function handleNo() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const texts = ["Are you sure?", "Think again!", "Please?", "Last chance!", "Wait, no!"];
            noBtn.innerText = texts[Math.min(noCount++, 4)];
            yesBtn.style.transform = `scale(${1 + noCount * 0.4})`;
            if(noCount > 5) noBtn.style.display = "none";
        }

        function celebrate() {
            document.getElementById('ask-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'flex';
            
            const duration = 12 * 1000;
            const end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0 }, colors: ['#ff4d6d', '#ffffff'] });
                confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1 }, colors: ['#ff4d6d', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // Background Hearts
        setInterval(() => {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️'; heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 500);
    </script>
</body>
</html>
